# The Play app's identity, in one place (ADR 0020). Everything else in the
# Android project (manifest placeholders, shortcuts, share target, asset
# statements) is derived from these and from ../web/manifest.webmanifest.

# The Play package name. PERMANENT once the first build is uploaded to Play:
# Play never lets an app change it, and no other app can ever use it. Change
# it here, and only here, before that first upload.
kinPackage=kin.app

# The one origin the app opens (no scheme, no path). It must serve
# /.well-known/assetlinks.json for this package (KIN_ANDROID_PACKAGE,
# KIN_ANDROID_CERT_SHA256).
kinHost=kin.journeytocode.io

# Play's versionCode: a whole number that must go up by at least one for every
# build uploaded to Play. versionName is read from ../package.json (Kin's
# version when the wrapper was built). See docs/ANDROID.md "Versioning".
kinVersionCode=1

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
