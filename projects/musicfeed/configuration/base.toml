[application]
host = "127.0.0.1"
port = 8000

[metadata]
# MusicBrainz requires a User-Agent identifying the application and returns 403
# without one. See https://musicbrainz.org/doc/XML_Web_Service/Rate_Limiting
# It also asks for ~1 request/second, so the metadata lookup should not sit on a
# hot path until that is accounted for.
musicbrainz_base_url = "https://musicbrainz.org/ws/2"
cover_art_base_url = "https://coverartarchive.org"

[basicauth]
username = "test"
password = "test"

[database]
# Created on first run; survives between runs by design (v0.5.0).
path = "musicfeed.db"
max_connections = 5

[healing]
# The background pass that re-runs failed metadata lookups. politeness budget:
# at most `per_pass` lookups per pass, one pass per interval — far under the
# MusicBrainz ~1 req/s guidance.
enabled = true
interval_secs = 900
max_attempts = 3
per_pass = 3
