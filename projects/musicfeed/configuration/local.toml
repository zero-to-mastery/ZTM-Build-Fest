# Local environment overrides.
#
# Intentionally empty: `base.toml` already holds the local defaults. Add keys
# here to diverge from base without touching the other environments, e.g.
#
#   [application]
#   port = 8080
#
# Environment variables (APP_APPLICATION__PORT=8080) override both.

[cors]
# Replaces (does not extend) the base list, so the production origins are
# repeated here alongside the locally served blog.
allowed_origins = [
    "https://crusty-metallian.net",
    "https://www.crusty-metallian.net",
    "http://localhost:8080",
]
