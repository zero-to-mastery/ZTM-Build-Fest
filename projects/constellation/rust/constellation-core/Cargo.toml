[package]
name = "constellation-core"
version = "2.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
# One codegen unit lets LTO deduplicate across the crate: ~40 KB smaller WASM with
# no measured runtime cost. Standalone HTML embeds this binary under a 1 MiB budget.
codegen-units = 1
