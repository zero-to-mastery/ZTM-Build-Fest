<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
<title id="title">example-community’s GitHub constellation</title>
<desc id="description">Organization universe. 6 nodes, 0 bounded connections. Contributor diamonds connect through shared projects; project and technology views show repository relationships. Contributor size reflects represented repository count. 48 repositories discovered; 48 matching filters; 0 represented directly; 48 through era systems; 0 omitted. Contributor visualization represents the selected organization scope: 48/48 repositories scanned, up to 25 contributors per repository. Contributor totals are current; historical views filter project creation dates, not contributor tenure.</desc>
<defs><clipPath id="shape-diamond" clipPathUnits="objectBoundingBox"><path d="M.5 0 1 .5 .5 1 0 .5Z"/></clipPath><clipPath id="shape-square" clipPathUnits="objectBoundingBox"><path d="M.15 .15H.85V.85H.15Z"/></clipPath><clipPath id="shape-hexagon" clipPathUnits="objectBoundingBox"><path d="M.25 .07H.75L1 .5 .75 .93H.25L0 .5Z"/></clipPath><clipPath id="shape-star" clipPathUnits="objectBoundingBox"><path d="M.5 0 .62 .34 .98 .35 .7 .57 .8 .93 .5 .72 .2 .93 .3 .57 .02 .35 .38 .34Z"/></clipPath><radialGradient id="nebula"><stop stop-color="var(--sky-background)" stop-opacity=".13"/><stop offset="1" stop-color="var(--sky-background)" stop-opacity="0"/></radialGradient><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
svg{--sky-background:#fafaf3;--sky-foreground:#202516;--sky-accent:#595600;--sky-line:#838d66;--sky-star:#8b8500}@media(prefers-color-scheme:dark){svg{--sky-background:#111111;--sky-foreground:#f3f3f4;--sky-accent:#e3de13;--sky-line:#555a38;--sky-star:#e3de13}}
svg{background:transparent;border:none;outline:none;color:var(--sky-foreground);font:13px system-ui,sans-serif}text{fill:currentColor}.background{fill:none;stroke:none}.dust{fill:var(--sky-foreground)}.connections{fill:none;stroke:var(--sky-line);stroke-width:.9;opacity:.8}.shared-language{stroke-linecap:round}.shared-language[data-emphasis="primary"]{stroke:var(--sky-accent);opacity:.62}.shared-language[data-emphasis="secondary"]{opacity:.13}.star{fill:var(--sky-star);}.language circle{fill:var(--sky-accent)}.language text{text-anchor:middle;fill:var(--sky-accent);font-weight:600}.repo-label{text-anchor:middle;font-size:10px;stroke:none}.caption{font-size:12px;opacity:.65}.heading{font-size:23px;font-weight:600}@keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}
.star{filter:url(#glow)}.star-halo{fill:var(--sky-star);opacity:.07}.star-core{fill:var(--sky-foreground);opacity:.9;pointer-events:none}.language text{font-size:10px;letter-spacing:2px;font-weight:500}.repo-label{fill:var(--sky-foreground);opacity:.68}.heading{font-size:20px;letter-spacing:-.5px}.chart-guide{fill:none;stroke:var(--sky-line);stroke-width:.5;opacity:.28}
.bridges{fill:none;stroke:var(--sky-accent);stroke-width:1;stroke-dasharray:2 5;opacity:.35}
.identity-ring{fill:none;stroke:var(--sky-accent);stroke-width:.65;opacity:.14;pointer-events:none}.identity-point{fill:var(--sky-accent);stroke:none}
.star[data-kind="language"]{stroke:var(--sky-foreground);stroke-width:.8}.star[data-kind="topic"]{stroke:var(--sky-foreground);stroke-width:1;stroke-dasharray:2 2}
.star,.star-halo{fill:var(--node-color,var(--sky-star))}
.credit{font-size:9px;opacity:.65;fill:var(--sky-accent);text-anchor:end}a{text-decoration:none}
.generated-at{font-size:9px;opacity:.6;fill:var(--sky-foreground);text-anchor:start}




</style>
