<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
<title id="title">example’s GitHub constellation</title>
<desc id="description">6 public repositories arranged in a deterministic identity ring point layout. Solid lines connect projects through selected languages; detected languages include secondary languages; dotted bridges join nearby groups visually and do not represent dependencies. 1 of 1 shared connections shown. Brighter paths emphasize nearby relationships; faint paths preserve the remaining selected overlaps. Star size reflects GitHub stars. Identity rings are seeded by the account name; ring points provide placement anchors for nodes. newborn, active, quiet, dormant, archived, mature. Node appearance reflects project age and known maintenance. </desc>
<defs><radialGradient id="nebula"><stop stop-color="var(--sky-background)" stop-opacity=".13"/><stop offset="1" stop-color="var(--sky-background)" stop-opacity="0"/></radialGradient><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>

.repository[data-lifecycle="quiet"]{opacity:.7}.repository[data-lifecycle="dormant"]{opacity:.4}
.repository[data-lifecycle="archived"] .star{fill:none;stroke:var(--node-color,var(--sky-star));stroke-width:1;filter:none;animation:none}
.repository[data-lifecycle="archived"] .star-core{display:none}
.repository[data-lifecycle="newborn"] .star-halo{opacity:.23;stroke:var(--node-color,var(--sky-star));stroke-width:.6}
.repository[data-lifecycle="mature"] .star-halo{opacity:.13;stroke:var(--node-color,var(--sky-star));stroke-width:1}
.repository[data-lifecycle="mature"] .star{animation:none}
.repository[data-age-mode="halo"]{opacity:1}.repository[data-age-mode="subtle"]{opacity:.85}
.repository[data-age-mode="halo"][data-lifecycle="quiet"] .star-halo{opacity:.04}.repository[data-age-mode="halo"][data-lifecycle="dormant"] .star-halo{opacity:.02;fill:none;stroke:var(--node-color,var(--sky-star));stroke-width:.5}
.repository[data-age-mode="color"] .star-halo{fill:var(--age-color,var(--sky-accent));opacity:.25}
.repository[data-lifecycle="newborn"]{--age-color:#93c5fd}.repository[data-lifecycle="active"]{--age-color:#a7f3d0}.repository[data-lifecycle="mature"]{--age-color:#fde68a}.repository[data-lifecycle="quiet"]{--age-color:#c4b5fd}.repository[data-lifecycle="dormant"]{--age-color:#94a3b8}
.history-pulse{animation:history-pulse 16s ease-in-out infinite}@keyframes history-pulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.history-pulse{animation:none}}
svg{--sky-background:#080c24;--sky-foreground:#dce6ff;--sky-accent:#a78bfa;--sky-line:#53619c;--sky-star:#93c5fd}
svg{background:transparent;border:none;outline:none;color:var(--sky-foreground);font:13px system-ui,sans-serif}text{fill:currentColor}.background{fill:none;stroke:none}.dust{fill:var(--sky-foreground)}.connections{fill:none;stroke:var(--sky-line);stroke-width:.9;opacity:.8}.shared-language{stroke-linecap:round}.shared-language[data-emphasis="primary"]{stroke:var(--sky-accent);opacity:.62}.shared-language[data-emphasis="secondary"]{opacity:.13}.star{fill:var(--sky-star);animation:twinkle 6s ease-in-out infinite;}.language circle{fill:var(--sky-accent)}.language text{text-anchor:middle;fill:var(--sky-accent);font-weight:600}.repo-label{text-anchor:middle;font-size:10px;stroke:none}.caption{font-size:12px;opacity:.65}.heading{font-size:23px;font-weight:600}@keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}
.star{filter:url(#glow)}.star-halo{fill:var(--sky-star);opacity:.07}.star-core{fill:var(--sky-foreground);opacity:.9;pointer-events:none}.language text{font-size:10px;letter-spacing:2px;font-weight:500}.repo-label{fill:var(--sky-foreground);opacity:.68}.heading{font-size:20px;letter-spacing:-.5px}.chart-guide{fill:none;stroke:var(--sky-line);stroke-width:.5;opacity:.28}
.bridges{fill:none;stroke:var(--sky-accent);stroke-width:1;stroke-dasharray:2 5;opacity:.35}
.identity-ring{fill:none;stroke:var(--sky-accent);stroke-width:.65;opacity:.14;pointer-events:none}.identity-point{fill:var(--sky-accent);stroke:none}
.star[data-kind="language"]{stroke:var(--sky-foreground);stroke-width:.8}.star[data-kind="topic"]{stroke:var(--sky-foreground);stroke-width:1;stroke-dasharray:2 2}
.star,.star-halo{fill:var(--node-color,var(--sky-star))}
.credit{font-size:9px;opacity:.65;fill:var(--sky-accent);text-anchor:end}a{text-decoration:none}
.generated-at{font-size:9px;opacity:.6;fill:var(--sky-foreground);text-anchor:start}

svg{background:var(--sky-background)}.star{filter:drop-shadow(0 0 3px var(--node-color,var(--sky-star)))}.shared-language[data-emphasis=&quot;secondary&quot;]{opacity:0.24}



</style>
<rect class="background" width="900" height="560" rx="18"/>
<ellipse cx="440" cy="280" rx="420" ry="240.79999999999998" fill="url(#nebula)"/>



