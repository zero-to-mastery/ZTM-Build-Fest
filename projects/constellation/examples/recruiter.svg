  <title id="recruiter-title">alice · project constellation</title><desc id="recruiter-description">Alice Chen (@alice). JavaScript · Python · TypeScript. Repository topics: visualization. Size shows developer-curated presentation importance, not quality or skill: Featured, Supporting, then small Experimental/Historical projects; unassigned projects have a conservative default. Distance shows last repository push or observed work event: NOW under 30 days, RECENT under six months, EARLIER otherwise. Unknown recency is placed outside and identified in project titles. Repository activity is not necessarily the developer’s own activity. Color shows primary language; counts cover displayed repositories, not skill. Featured labels may show other loaded contributors, excluding this account; missing scans do not establish solo work. A + contributor count is a lower bound. Observed active months remain in project titles; partial history is a lower bound, not lifetime continuity or personal effort. Thin lines are explicitly curated project relationships. Other repositories counts cover loaded public repositories, including those outside current filters, not necessarily the whole account. No scores or engineering roles are inferred.</desc>
