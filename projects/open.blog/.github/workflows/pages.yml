# Builds the blog and publishes dist/ to GitHub Pages.
#
# Runs on every push to main, and on a schedule so posts with a future `date`
# go live on time (a scheduled post is published by the first build after its
# date). Adjust the cron to how precise you need publishing to be; hourly is a
# good default and well within the free Actions allowance for a small site.
#
# One-time setup: in the repository settings, under Pages, set Source to
# "GitHub Actions". For a custom domain, put the domain in static/CNAME and set
# "url" in openblog.json to match. For the default user.github.io/<repo> address,
# set "url" to that full address; the build derives the base path from it.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The engine repository deploys its example site. In a fork, change the name
    # below to your own repository to deploy, or delete this file if you host elsewhere.
    if: github.repository == 'journey-to-code-org/open.blog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build the WebAssembly module
        run: cargo run --release -p openblog-cli -- build-wasm
      - name: Build the site
        run: cargo run --release -p openblog-cli -- build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'journey-to-code-org/open.blog'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
