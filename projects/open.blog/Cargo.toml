[workspace]
resolver = "2"
members = [
    "crates/openblog-core",
    "crates/openblog-cli",
    "crates/openblog-wasm",
]

[workspace.package]
version = "0.52.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/journey-to-code-org/open.blog"

[workspace.dependencies]
http = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Password hashing is slow without optimizations; keep debug builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
