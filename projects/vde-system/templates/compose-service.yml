# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for service VMs
# Variables: {{NAME}}, {{SSH_PORT}}, {{SERVICE_PORTS}}, {{PKGS}}, {{CUSTOM_CMD}}
name: vde-{{NAME}}
services:
  vde-{{NAME}}:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: {{NAME}}
        PKGS_TO_INSTALL: "{{PKGS}}"
        CUSTOM_BUILD_CMD: "{{CUSTOM_CMD}}"
        POSTGRES_DEV_PASSWORD: "${POSTGRES_DEV_PASSWORD}"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-{{NAME}}:latest
    container_name: vde-{{NAME}}
    hostname: vde-{{NAME}}
    restart: unless-stopped

    # Docker Socket Sovereignty, cont'd (Issue #457): grant devuser access to
    # the bind-mounted host docker.sock via a launch-time supplementary GID
    # instead of the container ever chown'ing the host socket. Supplied
    # fresh by bin/vde on every ignition -- nothing GID-related is baked
    # into the image itself.
    group_add:
      - "${VDE_DOCKER_SOCK_GID:-1000}"

    ports:
      - "{{SSH_PORT}}:{{SSH_PORT}}"
##SERVICE_PORTS##

    volumes:
      - ../../../../:/vde:ro
      - ../../../../data/{{NAME}}:/data
      - ../../../../logs/{{NAME}}:/logs
      # Persistence mapping
      - ../../../../data/{{NAME}}/pgdata:/var/lib/postgresql/data
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - REDIS_ARGS=--save 60 1 --loglevel warning

    env_file:
      - ../../../../.env
      - ../../../../env-files/{{NAME}}.env

    networks:
      vde-net:
        aliases:
          - "{{NAME}}"
          - "vde-{{NAME}}"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name={{NAME}}"

    healthcheck:
      test: ["CMD-SHELL", "if [ \"{{NAME}}\" = \"mysql\" ]; then mysqladmin ping -h localhost; elif command -v pg_isready >/dev/null; then pg_isready -U postgres; elif command -v redis-cli >/dev/null; then redis-cli ping; else exit 0; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  vde-net:
    external: true
