# VDE ARCHITECTURAL RECORD
# @shared-law (Forge Component)
[pytest]
# Pytest configuration for VDE unit tests
# Note: This file provides basic pytest settings.
# Schema-validated configuration is loaded from tests/pytest-config.json via conftest.py

# Test discovery
testpaths = tests/unit
python_files = *test*.py test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Console output
console_output_style = progress

# Logging
log_cli = true
log_cli_level = INFO

# Markers (from pytest-config.json, registered in conftest.py)
markers =
    slow: Marks tests as slow (deselect with '-m "not slow"')
    integration: Integration tests
    unit: Unit tests
    docker: Tests requiring Docker
    ssh: Tests requiring SSH
