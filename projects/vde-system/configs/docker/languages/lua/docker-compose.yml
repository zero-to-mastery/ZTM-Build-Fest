# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for language VMs
# Variables: lua, 2214, , zsh /vde/scripts/setup/lua-init.zsh
name: vde-lua
services:
  vde-lua:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: lua
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/lua-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-lua:latest
    container_name: vde-lua
    hostname: vde-lua
    restart: unless-stopped

    # Docker Socket Sovereignty, cont'd (Issue #457): grant devuser access to
    # the bind-mounted host docker.sock via a launch-time supplementary GID
    # instead of the container ever chown'ing the host socket. Supplied
    # fresh by bin/vde on every ignition -- nothing GID-related is baked
    # into the image itself.
    group_add:
      - "${VDE_DOCKER_SOCK_GID:-1000}"
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=lua"

    ports:
      - "2214:2214"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/lua:/home/devuser/workspace
      - ../../../../logs/lua:/logs
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../.env
      - ../../../../env-files/lua.env

    networks:
      vde-net:
        aliases:
          - "lua"
          - "vde-lua"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
