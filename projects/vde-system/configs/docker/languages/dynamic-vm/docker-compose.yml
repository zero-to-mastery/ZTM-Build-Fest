# VDE ARCHITECTURAL RECORD
# @shared-law (Forge Component)
# Template for language VMs
# Variables: dynamic-vm, 2298, htop, zsh /vde/scripts/setup/dynamic-vm-init.zsh
name: vde-dynamic-vm
services:
  vde-dynamic-vm:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: dynamic-vm
        PKGS_TO_INSTALL: "htop"
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/dynamic-vm-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-dynamic-vm:latest
    container_name: vde-dynamic-vm
    hostname: vde-dynamic-vm
    restart: unless-stopped

    # Docker Socket Sovereignty, cont'd (Issue #457): grant devuser access to
    # the bind-mounted host docker.sock via a launch-time supplementary GID
    # instead of the container ever chown'ing the host socket. Supplied
    # fresh by bin/vde on every ignition -- nothing GID-related is baked
    # into the image itself.
    group_add:
      - "${VDE_DOCKER_SOCK_GID:-1000}"
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=dynamic-vm"

    ports:
      - "2298:2298"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/dynamic-vm:/home/devuser/workspace
      - ../../../../logs/dynamic-vm:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../env-files/dynamic-vm.env

    networks:
      vde-net:
        aliases:
          - "dynamic-vm"
          - "vde-dynamic-vm"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
