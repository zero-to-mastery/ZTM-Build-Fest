# VDE ARCHITECTURAL RECORD
# @shared-law (Forge Component)
[behave]
show_skipped = True
paths = tests/features
tags = not wip
verbose = False
capture = True
capture_stderr = True
# Colorized step output (ANSI):
#   executing  → grey   (currently running step)
#   passed     → green
#   failed     → red
#   undefined  → yellow (warnings / skipped)
color = auto
format = pretty
# === Tag Taxonomy (NEW SCHEME) ===
# FAST TESTS (No Docker Required)
# @parser    = Natural language parser tests
# @spec      = Spec invariant tests  
# @config    = Config generation tests (SSH, docker-compose)
# @error-path = Error handling tests
# INTEGRATION TESTS (Require Docker)
# @integration = All Docker-requiring tests (umbrella)
# @vm-lifecycle = create/start/stop/remove VMs
# @vm-rebuild   = rebuild --no-cache tests
# @ssh-access  = SSH into running VMs
# @networking  = VM-to-VM communication
# @storage    = volume/data tests
# OTHER
# @wip        = work-in-progress (excluded from default run)
# === Running Tests ===
# All tests:          python3 -m behave
# Fast tests only:    python3 -m behave --tags="@parser,@spec,@config,@error-path"
# With integration:   python3 -m behave --tags="@integration"
# Parser tests:       python3 -m behave --tags=@parser
# Spec tests:         python3 -m behave --tags=@spec
# Config tests:       python3 -m behave --tags=@config
# Error-path tests:   python3 -m behave --tags=@error-path
# VM lifecycle:       python3 -m behave --tags=@vm-lifecycle
# VM rebuild:         python3 -m behave --tags=@vm-rebuild
